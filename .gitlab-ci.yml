stages:
  - prepare
  - cs-fix
  - lint
  - tests
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"

variables:
  COMPOSER_MEMORY_LIMIT: -1
  YAMLLINT_DIRECTORIES: config/packages
    
include:
  - project: 'intern/runner-templates'
    file: '/symfony/install-dependencies.yml'
    ref: "17.5"
  - project: 'intern/runner-templates'
    ref: "17.5"
    file: '/php/code-style-fixer.yml'
  - project: 'intern/runner-templates'
    ref: "17.5"
    file: '/php/phpstan.yml'
  - project: 'intern/runner-templates'
    file: '/php/composer-require-checker.yml'
    ref: "17.5"
  - project: 'intern/runner-templates'
    file: '/php/composer-unused.yml'
    ref: "17.5"
  - project: 'intern/runner-templates'
    file: '/php/phpunit.yml'
    ref: "17.5"
  - project: 'intern/runner-templates'
    file: '/yaml/yamllint.yml'
    ref: "17.5"
  - project: 'intern/runner-templates'
    file: '/deploy/deploy.yml'
    ref: "17.5"

.package-matrix: &package-matrix
  matrix:
    - PACKAGE:
      - main
      - phpstan
      - phpunit
      - rector

.package-cache: &package-cache
  key:
    files:
      - ${PACKAGE}/composer.lock
    prefix: ${CI_PROJECT_PATH_SLUG}_composer_${PACKAGE}
  paths:
    - ${PACKAGE}/vendor/
  policy: pull

install-dependencies:
  parallel: *package-matrix
  cache:
    <<: *package-cache
    policy: pull-push
  before_script:
    - cd ${PACKAGE}
  after_script:
    - find ${PACKAGE}/vendor/ -name .git -type d -exec rm -rf {} \+
  except:
    - main
    - tags

code-style-fixer:
  parallel: *package-matrix
  cache:
    - key:
        files:
          - ${PACKAGE}/composer.lock
        prefix: ${CI_PROJECT_PATH_SLUG}_composer_${PACKAGE}
      paths:
        - ${PACKAGE}/vendor/
      policy: pull
    - key: # See https://getrector.com/documentation/cache-in-ci
        files:
          - ${PACKAGE}/composer.lock
          - ${PACKAGE}/rector.php
        prefix: ${CI_PROJECT_PATH_SLUG}_rector_${PACKAGE}
      paths:
        - ${PACKAGE}/var/cache/rector
    - key:
        files:
          - ${PACKAGE}/composer.lock
          - ${PACKAGE}/.php-cs-fixer.dist.php
        prefix: ${CI_PROJECT_PATH_SLUG}_phpcsfixer_${PACKAGE}
      paths:
        - ${PACKAGE}/.php-cs-fixer.cache
    - key:
        files:
          - ${PACKAGE}/composer.lock
          - ${PACKAGE}/.twig-cs-fixer.dist.php
        prefix: ${CI_PROJECT_PATH_SLUG}_twigcsfixer_${PACKAGE}
      paths:
        - ${PACKAGE}/.twig-cs-fixer.cache
  before_script:
    - cd ${PACKAGE}

phpstan:
  parallel: *package-matrix
  cache:
    - key:
        files:
          - ${PACKAGE}/composer.lock
        prefix: ${CI_PROJECT_PATH_SLUG}_composer_${PACKAGE}
      paths:
        - ${PACKAGE}/vendor/
      policy: pull
    - key:
        files:
          - ${PACKAGE}/composer.lock
          - ${PACKAGE}/phpstan.dist.neon
        prefix: ${CI_PROJECT_PATH_SLUG}_phpstan_${PACKAGE}
      paths:
        - ${PACKAGE}/var/cache/phpstan
  before_script:
    - cd ${PACKAGE}
  after_script:
    - if [[ -f ${PACKAGE}/phpstan.json ]]; then cat ${PACKAGE}/phpstan.json; fi

phpunit:
  cache:
    key:
      files:
        - ${PACKAGE}/composer.lock
      prefix: ${CI_PROJECT_PATH_SLUG}_composer_${PACKAGE}
    paths:
      - ${PACKAGE}/vendor/
    policy: pull
  before_script:
    - cd rector
  except:
    - schedules
    - tags
    - main

yaml-analysis:
  before_script:
    - cd main
  except:
    - schedules
    - tags
    - main

composer-require-checker:
  parallel: *package-matrix
  cache: *package-cache
  before_script:
    - cd ${PACKAGE}
  except:
    - schedules
    - tags
    - main

composer-unused:
  parallel: *package-matrix
  cache: *package-cache
  before_script:
    - cd ${PACKAGE}
  after_script:
    - if [[ -f ${PACKAGE}/composer-unused.json ]]; then cat ${PACKAGE}/composer-unused.json; fi
  except:
    - schedules
    - tags
    - main

deploy-staging:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_REF_NAME == "main" || $CI_COMMIT_BRANCH
      when: on_success
    - when: never

deploy-production:
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
  release:
    name: Release $CI_COMMIT_TAG
    tag_name: $CI_COMMIT_TAG
    description: 'Tagged release: $CI_COMMIT_TAG'
